version: 1

workspace:
  name: project-centralized
  # This repo is the workspace; all paths are relative to its root.
  # repos/ and worktrees/ are gitignored and built by `pcctl init`.

operating_model:
  active_projects_per_session: 1
  multiple_agents_allowed: true
  owner_has_final_authority: true

# Register projects here (see AGENTS.md "Adding a project"). Example:
#
#   my-project:
#     name: My Project
#     classification: personal        # personal | work
#     type: web-application           # web-application | backend-service | game | template | ...
#     project_path: projects/my-project
#     repo_path: repos/my-project
#     remote: git@github.com:<org>/<repo>.git
#     default_branch: main
#     working_branch: null
projects:
  test-01:
    name: test-01
    kind: prototype
    classification: personal
    type: prototype
    project_path: projects/test-01
    repo: local
    repo_path: repos/test-01
    remote: null
    default_branch: main
    working_branch: null

# Sholat times for the dashboard: virtual workers go to wudhu and the mushola at each
# of the five daily prayers, and new agent launches are held for window_min minutes
# (override possible). Kemenag RI parameters; computed offline.
prayer:
  enabled: true
  city: Malang
  lat: -7.9797
  lon: 112.6304
  timezone: Asia/Jakarta
  fajr_angle: 20
  isha_angle: 18
  asr_factor: 1 # 1 = Syafi'i, 2 = Hanafi
  elevation_m: 0
  ihtiyat_min: 2
  window_min: 20 # wudhu + sholat + walking back
  hold_launches: true

policies:
  require_active_project: true
  require_task_for_code_changes: true
  require_decision_log_for_major_architecture_change: true
  require_owner_approval_for_high_risk_change: true
  require_owner_request_for_commit_and_push: true
